model:
  model_name: "google/gemma-4-E4B-it"

data:
  train:
    datasets:
      - dataset_name: "oumi-ai/oumi-letter-count"
        split: "train"
  validation:
    datasets:
      - dataset_name: "oumi-ai/oumi-letter-count"
        split: "test"

training:
  trainer_type: "VERL_GRPO"

  #Training duration
  #num_train_epochs: 3
  max_steps: 5

  # Batch size settings
#   per_device_train_batch_size: 2
#   gradient_accumulation_steps: 1

  # Optimization
  learning_rate: 5e-7
  optimizer: "adafactor"

  # Learning rate schedule
  lr_scheduler_type: "cosine"
  warmup_steps: 20

  # Checkpointing
  save_steps: 5

  # Evaluation
  eval_strategy: "steps"
  eval_steps: 5

#   reward_functions: ["count_letters"]

  # Distributed training
  ddp_find_unused_parameters: False       # Find unused parameters in DDP

  # Mixed precision and performance
  compile: False

  # DataLoader settings
  dataloader_num_workers: "auto"
  dataloader_prefetch_factor: 32

  # Logging
  logging_steps: 10


  grpo:
    num_generations: 4 #Ignored on the verl path — Oumi never maps it; rollout.n is what applies.
    max_completion_length: 512
    temperature: 1.0
    use_vllm: True
    vllm_gpu_memory_utilization: 0.3

  verl_config_overrides:
    data:
      train_batch_size: 64
    #   val_batch_size: 640
      max_prompt_length: 256
      train_files: "/workspace/christina/GRPO/letter_counting_tutorial/verl_data/train.parquet"
      val_files: "/workspace/christina/GRPO/letter_counting_tutorial/verl_data/validation.parquet"

    actor_rollout_ref:
      model:
        use_remove_padding: False # change if from True to avoid ModuleNotFoundError: No module named 'flash_attn'
        override_config: # use sdpa instead of flashattention, cause flashattention cant work for gemma4 due to head sizes
          attn_implementation: sdpa
      actor:
        use_kl_loss: True
        kl_loss_coef: 0.001
        kl_loss_type: "low_var_kl"
        ppo_mini_batch_size: 16
        ppo_micro_batch_size_per_gpu: 2
        fsdp_config:
          param_offload: True
          optimizer_offload: True

      rollout:
        log_prob_micro_batch_size_per_gpu: 8
        tensor_model_parallel_size: 2 # each rollout replica will use 2 GPUs (model split across 2 GPUs)
        n: 4
        checkpoint_engine:
          update_weights_bucket_megabytes: 11264 #12288 #4096    # add — default 2048 is too small
      ref:
        log_prob_micro_batch_size_per_gpu: 16
        fsdp_config:
          param_offload: True
    algorithm:
      kl_ctrl:
        kl_coef: 0.001
    trainer:
      critic_warmup: 0
      val_before_train: False
      n_gpus_per_node: 4
      nnodes: 1

    reward:
      custom_reward_function:
        path: "letter_counting_tutorial/count_letters_verl.py"
        name: "count_letters_verl"

  output_dir: "letter_counting_tutorial/gemma4_e4b_grpo"
  run_name: "grpo_verl_countletters_gemma4"
  enable_wandb: True
