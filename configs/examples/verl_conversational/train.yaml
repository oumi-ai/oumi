model:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"   # small cached policy for the smoke
data:
  train:
    datasets:
      - dataset_name: "text_sft_jsonl"
        dataset_path: configs/examples/verl_conversational/seed_support.jsonl
  validation:
    datasets:
      - dataset_name: "text_sft_jsonl"
        dataset_path: configs/examples/verl_conversational/seed_support.jsonl
training:
  trainer_type: VERL_GRPO
  reward_funcs: ["conversation_llm_judge"]
  grpo:
    use_vllm: true
    max_completion_length: 512
  verl_config_overrides:
    actor_rollout_ref:
      rollout:
        mode: async
        agent:
          default_agent_loop: tool_agent      # ToolAgentLoop drives interactions (verl 0.7.1)
        multi_turn:
          enable: true
          interaction_config_path: configs/examples/verl_conversational/verl_interaction_config.yaml
          max_user_turns: 6
          max_assistant_turns: 6
    reward:
      reward_kwargs:
        # passed as **kwargs to conversation_llm_judge_reward (verl reward manager)
        judge_config_path: configs/examples/verl_conversational/judge.yaml
