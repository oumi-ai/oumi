model:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
data:
  train:
    datasets:
      - dataset_name: "text_sft_jsonl"
        dataset_path: configs/examples/verl_conversational/seed_support.jsonl
        dataset_kwargs:
          return_conversations: true
  validation:
    datasets:
      - dataset_name: "text_sft_jsonl"
        dataset_path: configs/examples/verl_conversational/seed_support.jsonl
        dataset_kwargs:
          return_conversations: true
training:
  trainer_type: VERL_GRPO
  reward_functions: ["conversation_llm_judge"]
  max_steps: 3
  num_train_epochs: 1
  save_steps: -1
  learning_rate: 1.0e-6
  run_name: "verl-conv-smoke"
  grpo:
    use_vllm: true
    max_completion_length: 512
    temperature: 1.0
    vllm_gpu_memory_utilization: 0.4
  verl_config_overrides:
    data:
      train_batch_size: 3
      val_batch_size: 3
      max_prompt_length: 4096
    actor_rollout_ref:
      model:
        # Avoid the image's incompatible flash-attn/cutlass build.
        use_remove_padding: false
        override_config:
          attn_implementation: sdpa
      actor:
        ppo_mini_batch_size: 3
        ppo_micro_batch_size_per_gpu: 1
      ref:
        log_prob_micro_batch_size_per_gpu: 1
      rollout:
        mode: async
        n: 4
        tensor_model_parallel_size: 1
        log_prob_micro_batch_size_per_gpu: 1
        agent:
          default_agent_loop: tool_agent
          # Must divide train_batch_size * n.
          num_workers: 4
        multi_turn:
          enable: true
          interaction_config_path: configs/examples/verl_conversational/verl_interaction_config.yaml
          max_user_turns: 6
          max_assistant_turns: 6
    trainer:
      n_gpus_per_node: 1
      nnodes: 1
      val_before_train: false
    reward:
      reward_kwargs:
        judge_config_path: configs/examples/verl_conversational/judge.yaml
