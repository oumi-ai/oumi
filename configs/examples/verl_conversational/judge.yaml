judge_params:
  prompt_template: |
    A customer-support conversation and the customer's goal are given.
    Goal: {goal}
    Conversation:
    {conversation}
    Did the agent resolve the customer's goal? Answer 'resolved', 'partial', or 'unresolved'.
  prompt_template_placeholders: ["goal", "conversation"]
  response_format: XML
  judgment_type: ENUM
  judgment_scores: { resolved: 1.0, partial: 0.5, unresolved: 0.0 }
  include_explanation: false
inference_config:
  model:
    model_name: "gpt-4o"             # judge — ideally stronger than the user-sim
  engine: OPENAI
  generation:
    max_new_tokens: 64
