# verl GRPO training config for Countdown with Qwen3-8B-Base (LoRA).
#
# LoRA is configured through `verl_config_overrides` rather than Oumi's `peft` block:
# VerlGrpoTrainer._create_config() does not read `config.peft`.
#
# Requirements:
#   - 8x H100 (80GB) on a single node
#   - Log into WandB (`wandb login`) or disable `enable_wandb`
#
# Usage:
#   oumi train -c configs/examples/grpo_verl_countdown/train_qwen3_8b_lora.yaml
#
# See Also:
#   - Documentation: https://oumi.ai/docs/en/latest/user_guides/train/train.html
#   - Config class: oumi.core.configs.TrainingConfig
#   - Config source: https://github.com/oumi-ai/oumi/blob/main/src/oumi/core/configs/training_config.py
#   - Other training configs: configs/**/*train.yaml

model:
  model_name: "Qwen/Qwen3-8B-Base"

data:
  train:
    datasets:
      - dataset_name: "d1shs0ap/countdown"
        split: "train"
  validation:
    datasets:
      - dataset_name: "d1shs0ap/countdown"
        split: "test"

training:
  trainer_type: "VERL_GRPO"
  num_train_epochs: 1
  save_steps: 50
  eval_strategy: "steps"
  eval_steps: 25

  # LoRA needs a learning rate roughly an order of magnitude above full fine-tuning.
  learning_rate: 1.0e-5
  enable_gradient_checkpointing: True

  reward_functions: ["countdown"]

  grpo:
    max_completion_length: 1024
    use_vllm: True
    temperature: 1.0
    vllm_gpu_memory_utilization: 0.5

  verl_config_overrides:
    data:
      train_batch_size: 64
      val_batch_size: 640
      max_prompt_length: 256
    actor_rollout_ref:
      model:
        use_remove_padding: True
        lora_rank: 32
        lora_alpha: 32
        target_modules: "all-linear"
      actor:
        use_kl_loss: True
        kl_loss_coef: 0.001
        kl_loss_type: "low_var_kl"
        ppo_mini_batch_size: 16
        ppo_micro_batch_size_per_gpu: 2
      rollout:
        # Required for LoRA: vLLM loads the base model from safetensors and the
        # adapter is synced separately. `layered_summon` gathers FSDP shards per
        # layer during that sync to cap peak GPU memory.
        load_format: "safetensors"
        layered_summon: True
        log_prob_micro_batch_size_per_gpu: 2
        tensor_model_parallel_size: 2
        n: 16
      ref:
        log_prob_micro_batch_size_per_gpu: 1
        fsdp_config:
          param_offload: True
    algorithm:
      kl_ctrl:
        kl_coef: 0.001
    trainer:
      critic_warmup: 0
      val_before_train: True
      n_gpus_per_node: 8
      nnodes: 1
      max_actor_ckpt_to_keep: 2  # Cap retained checkpoints; unbounded default fills disk.

  output_dir: "output/grpo_verl_countdown_qwen3_8b_lora"
  run_name: "grpo_verl_countdown_qwen3_8b_lora"
  enable_wandb: True
