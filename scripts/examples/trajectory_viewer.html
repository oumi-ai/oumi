<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browser Trajectory Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --edge: #262b36; --muted: #8b94a7;
    --text: #e6e9ef; --user: #4f8cff; --assistant: #36c187; --tool: #d9a441;
    --system: #6b7280; --accent: #b078ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--edge); display: flex; gap: 14px;
           align-items: center; flex-wrap: wrap; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .stat { color: var(--muted); font-size: 13px; }
  header .error { color: #ff8e8e; font-weight: 600; }
  input[type="search"] { background: var(--bg); border: 1px solid var(--edge); color: var(--text);
           border-radius: 6px; padding: 5px 9px; min-width: 200px; }
  label.btn { background: var(--accent); color: #fff; border-radius: 6px; padding: 6px 12px;
           cursor: pointer; font-weight: 600; font-size: 13px; }
  label.btn input { display: none; }
  main { flex: 1; display: flex; min-height: 0; }
  #list { width: 280px; border-right: 1px solid var(--edge); overflow-y: auto; background: var(--panel); flex-shrink: 0; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--edge); cursor: pointer; }
  .item:hover { background: #1e222b; }
  .item.active { background: #232938; border-left: 3px solid var(--accent); }
  .item .topic { font-weight: 600; text-transform: capitalize; }
  .item .meta { color: var(--muted); font-size: 12px; }
  #detail { flex: 1; overflow-y: auto; padding: 18px 22px; }
  #detail .hdr { color: var(--muted); font-size: 13px; margin-bottom: 16px; border-bottom: 1px solid var(--edge); padding-bottom: 10px; }
  #detail .hdr b { color: var(--text); }
  .msg { margin: 12px 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--edge);
         background: var(--panel); max-width: 920px; }
  .msg .role { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 5px; }
  .msg.user .role { color: var(--user); } .msg.user { border-left: 3px solid var(--user); }
  .msg.assistant .role { color: var(--assistant); } .msg.assistant { border-left: 3px solid var(--assistant); }
  .msg.tool .role { color: var(--tool); } .msg.tool { border-left: 3px solid var(--tool); }
  .msg.system .role { color: var(--system); } .msg.system { opacity: .75; }
  .content { white-space: pre-wrap; word-break: break-word; }
  .toolcall { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
         background: #11141a; border: 1px solid var(--edge); border-radius: 6px; padding: 6px 9px; margin-top: 6px; }
  .toolcall .fn { color: var(--accent); font-weight: 600; }
  pre.toolout { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
         background: #11141a; border-radius: 6px; padding: 8px 10px; margin: 0; max-height: 220px;
         overflow: auto; white-space: pre-wrap; word-break: break-word; }
  pre.toolout.err { color: #ff8e8e; border: 1px solid #5a2a2a; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .pill { display: inline-block; background: #11141a; border: 1px solid var(--edge); border-radius: 10px;
         padding: 1px 8px; margin: 0 4px 4px 0; font-size: 12px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <header>
    <h1>Browser Trajectory Viewer</h1>
    <label class="btn">Load .jsonl<input id="file" type="file" accept=".jsonl,.txt" /></label>
    <span class="stat" id="count">no file loaded</span>
    <span class="stat error" id="parse-errors" role="alert"></span>
    <input type="search" id="search" placeholder="filter by topic or text…" />
  </header>
  <main>
    <div id="list"></div>
    <div id="detail"><div class="empty">Load a dataset .jsonl (e.g. <code>oumi_browser_dataset.jsonl</code>) to begin.</div></div>
  </main>
<script>
  let records = [];
  let active = -1;

  function messagesOf(rec) {
    if (Array.isArray(rec.messages)) return rec.messages;
    for (const v of Object.values(rec)) {
      if (v && typeof v === "object" && Array.isArray(v.messages)) return v.messages;
    }
    for (const v of Object.values(rec)) {
      if (Array.isArray(v) && v[0] && typeof v[0] === "object" && "role" in v[0]) return v;
    }
    return [];
  }
  function topicOf(rec) {
    return rec.oumi_topic ?? rec.topic ?? rec.data_source ?? "(item)";
  }
  function toolCallsOf(m) {
    return (m.tool_calls || []).map(tc => tc.function || tc);
  }
  function navUrls(msgs) {
    const urls = [];
    for (const m of msgs) for (const fn of toolCallsOf(m)) {
      if (fn.name === "navigate") {
        try { urls.push(JSON.parse(fn.arguments).url); } catch { urls.push(fn.arguments); }
      }
    }
    return urls;
  }
  function formatToolOutput(content) {
    let obj = content;
    if (typeof content === "string") {
      try { obj = JSON.parse(content); } catch { return content; }
    }
    if (obj && typeof obj === "object" && !Array.isArray(obj)) {
      return Object.entries(obj)
        .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v, null, 2)}`)
        .join("\n\n");
    }
    return typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function renderList() {
    const q = document.getElementById("search").value.toLowerCase();
    const list = document.getElementById("list");
    list.innerHTML = "";
    records.forEach((rec, i) => {
      const msgs = messagesOf(rec);
      const hay = (topicOf(rec) + " " + JSON.stringify(rec)).toLowerCase();
      if (q && !hay.includes(q)) return;
      const tools = msgs.reduce((n, m) => n + toolCallsOf(m).length, 0);
      const el = document.createElement("div");
      el.className = "item" + (i === active ? " active" : "");
      el.innerHTML = `<div class="topic">#${i} · ${escapeHtml(topicOf(rec))}</div>
        <div class="meta">${msgs.length} msgs · ${tools} tool calls</div>`;
      el.onclick = () => { active = i; renderList(); renderDetail(rec); };
      list.appendChild(el);
    });
  }

  function renderDetail(rec) {
    const msgs = messagesOf(rec);
    const tools = msgs.reduce((n, m) => n + toolCallsOf(m).length, 0);
    const urls = navUrls(msgs).map(u => `<span class="pill">${escapeHtml(u)}</span>`).join("") || "—";
    const d = document.getElementById("detail");
    d.innerHTML = `<div class="hdr">topic <b>${escapeHtml(topicOf(rec))}</b> ·
        <b>${msgs.length}</b> messages · <b>${tools}</b> tool calls<br>attempted navigation: ${urls}</div>`;
    for (const m of msgs) d.appendChild(renderMsg(m));
    d.scrollTop = 0;
  }

  function renderMsg(m) {
    const role = m.role || "?";
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    let html = `<div class="role">${escapeHtml(role)}</div>`;
    if (m.content && role !== "tool") html += `<div class="content">${escapeHtml(
      typeof m.content === "string" ? m.content : JSON.stringify(m.content))}</div>`;
    for (const fn of toolCallsOf(m)) {
      html += `<div class="toolcall"><span class="fn">${escapeHtml(fn.name)}</span>(${escapeHtml(fn.arguments || "")})</div>`;
    }
    if (role === "tool") {
      const txt = formatToolOutput(m.content);
      const isErr = /error|timeout|exceeded/i.test(txt);
      html += `<pre class="toolout${isErr ? " err" : ""}">${escapeHtml(txt)}</pre>`;
    }
    wrap.innerHTML = html;
    return wrap;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function loadRecords(text, label) {
    records = [];
    const parseErrors = [];
    text.split("\n").forEach((line, i) => {
      if (!line.trim()) return;
      try { records.push(JSON.parse(line)); } catch { parseErrors.push(i + 1); }
    });
    active = records.length ? 0 : -1;
    document.getElementById("count").textContent = `${label} · ${records.length} trajectories`;
    document.getElementById("parse-errors").textContent = parseErrors.length
      ? `Skipped ${parseErrors.length} malformed line${parseErrors.length === 1 ? "" : "s"}: ${parseErrors.join(", ")}`
      : "";
    renderList();
    if (records.length) {
      renderDetail(records[0]);
    } else {
      document.getElementById("detail").innerHTML = `<div class="empty">${parseErrors.length
        ? "No valid trajectories found. Check the malformed line numbers above."
        : "No trajectories found in this file."}</div>`;
    }
  }

  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => loadRecords(r.result, f.name);
    r.readAsText(f);
  });
  document.getElementById("search").addEventListener("input", renderList);

  if (window.__EMBEDDED__) loadRecords(window.__EMBEDDED__, "embedded dataset");
</script>
</body>
</html>
