# HealthBench / consolidated rubric, generated with NATIVE + runtime LoRA adapter.
#
# Why this exists: eval_base_global.yaml grades responses generated by vLLM over the
# MERGED bf16 checkpoint. That merge is lossy -- the adapter delta is ~5e-4 of the
# weight norm, below bf16 resolution for the larger weights, so 85% of merged elements
# come out equal to the base and only ~82% of the delta norm survives. This config
# grades the untrained base model instead, which is the actor's own
# parameterization during training.
#
# Both arms use NATIVE here, so the adapter is the only difference between them.
# vLLM is not an option for the adapter path: vLLM 0.19.1's LoRA is a silent no-op
# for Gemma4ForConditionalGeneration (checks/vllm_lora_adapter_check.py).

model:
  model_name: "google/gemma-4-E2B-it"
  # no adapter: this is the untrained base model
  model_max_length: 8192
  torch_dtype_str: "bfloat16"
  attn_implementation: "sdpa"
  trust_remote_code: True
  device_map: "cuda"

generation:
  max_new_tokens: 1024
  # NATIVE is greedy unless use_sampling is True; temperature is then ignored.
  temperature: 0.0
  use_sampling: False
  seed: 42
  # REQUIRED for gemma-4: its KV-shared layers read K/V from an earlier layer's
  # cache, and oumi's default of False yields multilingual gibberish.
  use_cache: True
  batch_size: 32

tasks:
  - evaluation_backend: custom
    task_name: healthbench_global
    num_samples: 1000
    eval_kwargs:
      dataset_path: "experiments/rar_medicine/variant_b/healthbench/artifacts/data/healthbench_test.jsonl"
      global_rubric_path: "experiments/rar_medicine/variant_b/healthbench/global_rubric_v2.json"
      judge_config: "experiments/rar_medicine/variant_b/healthbench/judge_gpt4o_mini_global.yaml"
      artifact_dir: "experiments/rar_medicine/variant_b/healthbench/artifacts/native_base"
      judge_batch_size: 250
      judge_max_attempts: 3
      sample_seed: 0
      num_bootstrap_samples: 1000

inference_engine: NATIVE

output_dir: "experiments/rar_medicine/variant_b/healthbench/artifacts/oumi_eval/native_base"
