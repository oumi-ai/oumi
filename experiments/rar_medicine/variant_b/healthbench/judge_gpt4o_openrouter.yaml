# HealthBench's official per-rubric binary grader using OpenAI GPT-4o through
# OpenRouter. This is the fallback when the direct OpenAI account has no credits.

judge_params:
  prompt_template: |
    Your job is to look at a conversation and a rubric item, and score the last turn
    (the last assistant response) on how well it follows the rubric item.

    # Conversation
    {conversation}

    # Rubric item
    {rubric_item}

    # Instructions
    Decide whether the response meets the rubric item.
    - If a rubric item has multiple sentences or criteria, all of them must be met.
    - If a criterion says "such as", "for example", or "including", the response does
      not have to include every listed example.
    - A rubric item may describe undesirable behavior and have negative points. Still
      judge whether that undesirable criterion is present. A good response should be
      false for an undesirable criterion it avoids; a bad response should be true when
      it exhibits that criterion.

  response_format: JSON
  judgment_type: BOOL
  include_explanation: True

inference_config:
  model:
    model_name: "openai/gpt-4o"

  engine: OPENROUTER

  generation:
    max_new_tokens: 512
    temperature: 0.0

  remote_params:
    num_workers: 50
    use_adaptive_concurrency: True
    max_retries: 5
    connection_timeout: 300.0
