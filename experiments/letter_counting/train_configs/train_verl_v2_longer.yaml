# verl GRPO config to train gemma-4-E2B-it on letter counting.
#
# Adapted from configs/examples/grpo_verl_countdown/train.yaml (which carries the
# gemma-4 rollout workarounds) for the letter counting task from
# configs/examples/letter_counting/grpo/train.yaml (TRL version).
#
# Requirements:
#   - Log into WandB (`wandb login`) or disable `enable_wandb`
#
# Usage:
#   oumi train -c configs/examples/letter_counting/grpo/train_verl.yaml
#
# See Also:
#   - Documentation: https://oumi.ai/docs/en/latest/user_guides/train/train.html
#   - Config class: oumi.core.configs.TrainingConfig
#   - Config source: https://github.com/oumi-ai/oumi/blob/main/src/oumi/core/configs/training_config.py
#   - Other training configs: configs/**/*train.yaml

model:
  model_name: "google/gemma-4-E2B-it"

data:
  train:
    datasets:
      - dataset_name: "oumi-ai/oumi-letter-count"
        split: "train"
        sample_count: 40000
  validation:
    datasets:
      - dataset_name: "oumi-ai/oumi-letter-count"
        split: "validation"
        # The full validation split is 10k examples; keep periodic eval cheap.
        sample_count: 640

training:
  trainer_type: "VERL_GRPO"
  # The train split has 100k examples (~1562 steps/epoch at batch size 64);
  num_train_epochs: 1
  save_steps: 100
  eval_strategy: "steps"
  eval_steps: 50

  learning_rate: 1.0e-6
  enable_gradient_checkpointing: True

  # verl-style reward registered in oumi (see
  # src/oumi/datasets/grpo/rewards/count_letters_rewards.py); the trainer wires
  # it into verl as an importable module, so no file paths are needed.
  reward_functions: ["count_letters_verl"]

  grpo:
    max_completion_length: 1024
    use_vllm: True
    temperature: 1.0
    vllm_gpu_memory_utilization: 0.4

  verl_config_overrides:
    data:
      train_batch_size: 64
      val_batch_size: 640
      max_prompt_length: 256
    actor_rollout_ref:
      model:
        override_config:
          attn_implementation: "sdpa"
        # Remove-padding requires the flash-attn package (flash_attn.bert_padding),
        # which is not installed; run padded forwards with sdpa instead.
        use_remove_padding: False
      actor:
        use_kl_loss: True
        kl_loss_coef: 0.001
        kl_loss_type: "low_var_kl"
        ppo_mini_batch_size: 16
        ppo_micro_batch_size_per_gpu: 4
        # With only 4 GPUs visible (running alongside another 4-GPU job), the
        # FSDP actor's weight-sync peak (~61GB) plus the colocated vLLM engine
        # does not reliably fit an 80GB H100; park actor params/optimizer on
        # CPU between uses like the ref worker already does.

        # Disabling FSDP for speed
        # fsdp_config:
        #   param_offload: True
        #   optimizer_offload: True
      rollout:
        log_prob_micro_batch_size_per_gpu: 4
        tensor_model_parallel_size: 2
        n: 16

        # # vLLM must sleep at level 1 (weights offloaded to CPU between
        # # rollouts, restored on wake). Level 2 DISCARDS the whole weight pool
        # # including non-parameter state; the per-step weight sync restores
        # # only named parameters, so gemma-4 serves gibberish forever (rewards
        # # pinned at the unparseable floor, zero advantage, no learning).
        # # In HYBRID/colocate mode verl HARDCODES level 2 for non-LoRA runs in
        # # vllm_async_server.py (site-packages sleep-level patch flips it
        # # to 1 -- GEMMA4_VERL_GRPO_FIXES.md Patch 2b);
        # # layered_summon only covers the ServerAdapter sleep path — kept as
        # # defense in depth, not sufficient on its own.
        # layered_summon: True

        # gemma-4's embed_tokens_per_layer is a single 9.4GB fp32 tensor
        # (262144 x 8960); the default 2048MB weight-sync bucket cannot hold it.
        checkpoint_engine:
          update_weights_bucket_megabytes: 10240

        # Letter counting is text-only: disable multimodal inputs so vLLM skips
        # profiling gemma-4's vision/audio towers (broken in the generic
        # TransformersMultiModal fallback used for this architecture).
        engine_kwargs:
          vllm:
            limit_mm_per_prompt:
              image: 0
              video: 0
              audio: 0

      ref:
        log_prob_micro_batch_size_per_gpu: 2
        fsdp_config:
          param_offload: True
    algorithm:
      kl_ctrl:
        kl_coef: 0.001
    trainer:
      critic_warmup: 0
      val_before_train: False
      n_gpus_per_node: 8
      nnodes: 1
      max_actor_ckpt_to_keep: 2

  output_dir: "output/letter_counting.grpo_verl_v2.bigger_dataset"
  run_name: "letter_counting_grpo_verl"
  enable_wandb: True
