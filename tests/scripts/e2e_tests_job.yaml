# Class: oumi.core.configs.JobConfig
# https://github.com/oumi-ai/oumi/blob/main/src/oumi/core/configs/job_config.py

# Sample command:
# oumi launch up --config tests/scripts/e2e_tests_job.yaml --cluster oumi-e2e-tests-cluster
name: oumi-e2e-tests

resources:
  cloud: gcp
  accelerators: "A100:4" # "A100:1", "A100-80GB:1", "A100-80GB:4"
  use_spot: false
  disk_size: 1000 # Disk size in GBs

num_nodes: 1 # Set it to N for multi-node training.

working_dir: .

file_mounts:
  ~/.netrc: ~/.netrc # WandB credentials
  ~/.cache/huggingface/token: ~/.cache/huggingface/token # HF credentials

envs:
  WANDB_PROJECT: oumi-e2e-tests
  ACCELERATE_LOG_LEVEL: info
  TOKENIZERS_PARALLELISM: false
  # https://pytorch.org/docs/stable/notes/cuda.html#optimizing-memory-usage-with-pytorch-cuda-alloc-conf
  PYTORCH_CUDA_ALLOC_CONF: "garbage_collection_threshold:0.8,max_split_size_mb:128"
  ENABLE_OUMI_UNIT_TESTS: "false"
  ENABLE_OUMI_INTEGRATION_TESTS: "false"
  ENABLE_OUMI_E2E_TESTS: "true"
  CUDA_LAUNCH_BLOCKING: 1

run: |
  set -xe  # Exit if any command failed.
  source "./configs/examples/misc/sky_init.sh"

  pip install uv && uv pip install --system -e ".[ci_gpu]" hf_transfer
  # flash-attn >=2.8 ships flash_attn/cute (FA4) which uses cutlass without declaring
  # it as a dependency, so pip can't pick a compatible version on its own.
  pip install flash-attn==2.8.3.post1 --no-build-isolation
  pip install "nvidia-cutlass-dsl==4.2.1"

  echo "Node ${SKYPILOT_NODE_RANK} starting..."
  echo "Unit tests: ${ENABLE_OUMI_UNIT_TESTS}"
  echo "Integration tests: ${ENABLE_OUMI_INTEGRATION_TESTS}"
  echo "e2e tests: ${ENABLE_OUMI_E2E_TESTS}"

  nvidia-smi

  echo "$(oumi env)"

  GPU_MULTIPLICITY_MARKER="single_gpu"
  if test ${OUMI_TOTAL_NUM_GPUS} -gt 1; then
    GPU_MULTIPLICITY_MARKER="multi_gpu"
  fi

  # Each cluster runs only the tests sized for its GPUs. Without this the
  # 80GB cluster would repeat everything the 40GB cluster already covered,
  # since both match the same "multi_gpu" marker. The window comes from each
  # test's requires_gpus(min_gb=...), so there is nothing to keep in sync here.
  GPU_MEMORY_MIB=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -n 1)
  GPU_MEMORY_GB=$((GPU_MEMORY_MIB / 1024))
  GPU_MEMORY_ARGS="--max-gpu-memory-gb=${GPU_MEMORY_GB}"

  # Tests at or under 40GB are covered by the smaller cluster in the matrix.
  SMALLER_CLUSTER_MEMORY_GB=40
  if test "${GPU_MEMORY_GB}" -gt "${SMALLER_CLUSTER_MEMORY_GB}"; then
    GPU_MEMORY_ARGS="${GPU_MEMORY_ARGS} --above-gpu-memory-gb=${SMALLER_CLUSTER_MEMORY_GB}"
  fi

  ROOT_DIR="$(pwd)"

  if "${ENABLE_OUMI_UNIT_TESTS}"; then
    cd "${ROOT_DIR}/tests/unit/"
    echo "Running all unit tests..."
    pytest -s -vv --durations=50 --timeout=300
  fi

  if "${ENABLE_OUMI_INTEGRATION_TESTS}"; then
    cd "${ROOT_DIR}/tests/integration/"
    echo "Running all integration tests..."
    pytest -s -vv --durations=50 --timeout=300
  fi

  if "${ENABLE_OUMI_E2E_TESTS}"; then
    cd "${ROOT_DIR}/tests/"
    echo "Running all tests: e2e and ${GPU_MULTIPLICITY_MARKER} (${GPU_MEMORY_ARGS})..."
    pytest -s -vv -m "e2e and ${GPU_MULTIPLICITY_MARKER}" ${GPU_MEMORY_ARGS} --durations=50 --timeout=1200
  fi

  echo "Node ${SKYPILOT_NODE_RANK} is all done!"
