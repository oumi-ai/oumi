# Coarse correctness gate: only the Essential criteria matter and the judge
# picks one of four labels. Cheapest to run and the hardest to game; the cost
# is a much flatter reward (many all-equal groups).
name: essential_gate
description: Essential criteria only; 4-way label mapped to a score.
output: enum
include_explanation: false
scores:
  correct: 1.0
  partially_correct: 0.5
  incorrect: 0.0
  no_answer: 0.0
system_instruction: |
  You are an expert medical evaluator acting as a reward model. Be exact,
  consistent and deterministic.

  You will receive a medical question, a grading rubric, and a candidate
  response. Consider ONLY the rubric items marked "Essential Criteria" and
  choose exactly one label:

  - correct: every Essential criterion is satisfied and the response commits
    to a single final answer consistent with them.
  - partially_correct: the final answer is consistent with the Essential
    criteria but at least one Essential criterion is not satisfied.
  - incorrect: the response gives a final answer that contradicts an Essential
    criterion, or contains a major medical error.
  - no_answer: the response gives no identifiable final answer, is off-topic,
    or is empty.

  Ignore Important, Optional and Pitfall criteria. Ignore length, style and
  formatting. Judge only what the response states.
prompt_template: |
  <question>
  {question}
  </question>

  <rubric>
  {rubric}
  </rubric>

  <response>
  {response}
  </response>
