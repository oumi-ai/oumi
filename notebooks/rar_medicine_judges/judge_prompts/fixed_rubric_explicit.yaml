# Fixed-rubric explicit aggregation: the same eight criteria as
# `fixed_rubric_implicit`, but the judge returns a met/not-met verdict per
# criterion and the weighted sum is computed in code (see
# common.explicit_rubric_score). Positive weights total 20. The implicit
# variant's "E1 fails -> cannot score above 3" rule cannot be expressed as a
# linear sum, so it is applied in code via `cap_if_unmet` below.
#
# Pitfall polarity: P1/P2 are stated here as what the response must AVOID, so
# that "met" consistently means "criterion satisfied" for every item, exactly
# as in the dataset-rubric variants.
name: fixed_rubric_explicit
description: Fixed 8-criterion reference-anchored rubric; per-criterion verdicts, weighted sum -> [0,1].
output: explicit_rubric
include_explanation: false
fixed_rubric:
  - id: E1
    weight: 5
    description: "Essential Criteria: The response's final conclusion (diagnosis, chosen option, value, or recommendation) agrees with the reference answer's conclusion."
  - id: E2
    weight: 5
    description: "Essential Criteria: The response explicitly and unambiguously commits to that single final answer (no hedging between alternatives, no implicit-only conclusion)."
  - id: I1
    weight: 4
    description: "Important Criteria: The reasoning given for the conclusion is medically sound and consistent with the reference answer's rationale."
  - id: I2
    weight: 3
    description: "Important Criteria: The response includes the key supporting facts present in the reference answer and connects the answer to the specifics of the question."
  - id: O1
    weight: 2
    description: "Optional Criteria: The response is clear, logically organized, and concise."
  - id: O2
    weight: 1
    description: "Optional Criteria: The tone and level of explanation fit the intended audience."
  - id: P1
    weight: -2
    description: "Pitfall Criteria: The response avoids endorsing an incorrect alternative answer, avoids contradicting the reference conclusion anywhere, and makes no unsafe or harmful recommendation."
  - id: P2
    weight: -1
    description: "Pitfall Criteria: The response avoids fabricated or incorrect incidental claims and misleading extraneous content."
# Faithful to the implicit variant's cap rule: a wrong final conclusion cannot
# score above 3/10.
cap_if_unmet:
  E1: 0.3
system_instruction: |
  You are a strict medical answer grader acting as a reward model. Be exact,
  consistent and deterministic: identical inputs must receive identical verdicts.

  Grade the RESPONSE against the REFERENCE ANSWER for the given QUESTION. The
  reference answer is the ground truth; where the response disagrees with it,
  the response is wrong.

  Decide "met" or "not met" for each of these eight criteria independently:

  Essential:
  - E1: The response's final conclusion (diagnosis, chosen option, value, or
    recommendation) agrees with the reference answer's conclusion.
  - E2: The response explicitly and unambiguously commits to that single final
    answer (no hedging between alternatives, no implicit-only conclusion).
  Important:
  - I1: The reasoning given for the conclusion is medically sound and consistent
    with the reference answer's rationale.
  - I2: The response includes the key supporting facts present in the reference
    answer and connects the answer to the specifics of the question.
  Optional:
  - O1: The response is clear, logically organized, and concise.
  - O2: The tone and level of explanation fit the intended audience.
  Pitfalls (these are stated as what the response must AVOID, so "met" means the
  response successfully avoids the problem):
  - P1: The response avoids endorsing an incorrect alternative answer, avoids
    contradicting the reference conclusion anywhere, and makes no unsafe or
    harmful recommendation.
  - P2: The response avoids fabricated or incorrect incidental claims and
    misleading extraneous content.

  Rules:
  - Judge only what the response states. Do not fill gaps with your own knowledge.
  - Judge content, not style preferences beyond O1 and O2.
  - Do not apply any weighting or overall score yourself; the eight verdicts are
    combined outside this call. Just decide each criterion on its own.
  - If the response is truncated, judge only what is present.

  Return one verdict per criterion, using the ids E1, E2, I1, I2, O1, O2, P1, P2
  in that order.
prompt_template: |
  <question>
  {question}
  </question>

  <reference_answer>
  {reference_answer}
  </reference_answer>

  <response>
  {response}
  </response>
